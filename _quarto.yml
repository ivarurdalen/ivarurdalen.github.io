execute:
  freeze: auto

project:
  type: website
  render:
    - "*.qmd"
    - "!notes/**/*.qmd"

website:
  title: "Ivar Soares Urdalen - Financial Data"
  open-graph: true
  site-url: https://ivarurdalen.com
  repo-url: https://www.github.com/ivarurdalen/ivarurdalen.github.io
  repo-actions: [edit, issue]
  search:
    location: navbar
    type: overlay
  page-footer:
    left: |
      Website made with [Quarto](https://www.quarto.org)
  navbar:
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "CV"
        file: cv_ivar.qmd
      - text: "Portfolio"
        file: site/portfolio/index.qmd
      - text: "Tools"
        file: site/tools/index.qmd
    right:
      - icon: github
        href: https://github.com/ivarurdalen/

  sidebar:
    - title: "Notes"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - notes/index.qmd
        - section: "Algorithmic Trading"
          contents:
            - notes/trading/index.qmd
            - notes/trading/strategies.qmd
        - section: "Databases"
          contents:
            - notes/databases/sql.qmd
            - notes/databases/financial-database.qmd

    - title: "Portfolio"
      contents:
        - site/portfolio/index.qmd

    - title: "Tools"
      contents:
        - site/tools/index.qmd
        - site/tools/terminal-setup.qmd

format:
  html:
    theme: cosmo
    fontsize: 1.0em
    code-copy: true
    code-overflow: wrap
    css: styles.css
    toc: true
    toc-title: "Contents"
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px
